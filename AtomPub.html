<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AtomPub · Journal of Multiscale Energy Materials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="theme-light.css" />
<script>
  // Apply persisted theme before render to avoid flash. Default = light.
  (function () {
    var t = "light";
    try { t = localStorage.getItem("atompub-theme") || "light"; } catch (e) {}
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="atoms.jsx"></script>
<script type="text/babel" src="home.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>
<script type="text/babel" src="article.jsx"></script>
<script type="text/babel" src="flow.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [view, setView] = useState("home");

  // Allow URL hash to drive view (deep link)
  useEffect(() => {
    const onHash = () => {
      const v = (window.location.hash || "#home").slice(1);
      if (["home", "dashboard", "article", "submit", "review"].includes(v)) setView(v);
    };
    onHash();
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  const goto = (v) => {
    setView(v);
    window.location.hash = v;
    window.scrollTo({ top: 0, behavior: "instant" });
  };

  return (
    <div data-screen-label={`AtomPub · ${view}`}>
      <TopNav view={view} onView={goto} />
      {view === "home"      && <HomeView />}
      {view === "dashboard" && <DashboardView />}
      {view === "article"   && <ArticleView />}
      {view === "submit"    && <SubmitView />}
      {view === "review"    && <ReviewView />}
      {view !== "dashboard" && view !== "submit" && view !== "review" && <Footer />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
